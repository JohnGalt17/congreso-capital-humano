<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votación | Congreso · Capital Humano</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/brand-tokens.css">
  <link rel="stylesheet" href="../css/landing.css">
</head>
<body>
  <div class="voto-page">
    <header class="brand-bar" style="align-self:center;">
      <img class="brand-bar__logo" src="../assets/logo.svg" alt="John Galt">
      <span class="brand-bar__title">Congreso · Capital Humano</span>
    </header>

    <div class="card card--accent voto-card">
      <p class="slide__kicker">Participá · votación en vivo</p>
      <p id="voto-profile-tag" class="voto-profile-tag">Perfil A</p>
      <h1 id="voto-title" class="voto-name">Valentina Morales</h1>
      <p id="voto-question" class="voto-question">¿Avanza Valentina a entrevista?</p>

      <div id="voto-actions" class="voto-actions" role="group" aria-label="Tu voto">
        <button type="button" class="vote-opt vote-opt--yes" data-choice="si" aria-pressed="false">
          <span class="vote-opt__label">SÍ</span>
        </button>
        <button type="button" class="vote-opt vote-opt--no" data-choice="no" aria-pressed="false">
          <span class="vote-opt__label">NO</span>
        </button>
      </div>

      <div id="voto-status" class="voto-confirm" role="status" aria-live="polite" hidden></div>

      <div id="voto-tally" class="tally-panel" aria-live="polite">
        <div class="tally-panel__head">
          <span class="tally-live"><span class="tally-live__dot" aria-hidden="true"></span> En vivo</span>
          <span id="voto-tally-total" class="tally-panel__total">0 votos</span>
        </div>
        <div class="tally-rows">
          <div class="tally-row tally-row--si">
            <div class="tally-row__meta">
              <span class="tally-row__label">SÍ</span>
              <span id="voto-count-si" class="tally-row__count">0</span>
            </div>
            <div class="tally-bar" aria-hidden="true"><span id="voto-bar-si" class="tally-bar__fill tally-bar__fill--si" style="width:0%"></span></div>
          </div>
          <div class="tally-row tally-row--no">
            <div class="tally-row__meta">
              <span class="tally-row__label">NO</span>
              <span id="voto-count-no" class="tally-row__count">0</span>
            </div>
            <div class="tally-bar" aria-hidden="true"><span id="voto-bar-no" class="tally-bar__fill tally-bar__fill--no" style="width:0%"></span></div>
          </div>
        </div>
        <p id="voto-tally-source" class="tally-panel__source"></p>
      </div>

      <a id="voto-other" class="voto-other-link" href="?q=b">Ir al otro perfil →</a>

      <p class="stub-note voto-rules-note" style="margin-top:1rem;">
        Un voto por perfil en esta sesión (A y B independientes). Una vez que votás este perfil, no se puede cambiar.
      </p>
      <button type="button" id="voto-reset" class="stub-btn voto-reset-btn" style="margin-top:0.75rem;width:100%;">Reiniciar tallies locales</button>
    </div>

    <a class="back-link" href="../index.html">← Volver al deck</a>
  </div>
  <script src="../js/api-config.js"></script>
  <script src="../js/voto.js" defer></script>
</body>
</html>
